; ============================================================
;  Dx11FsrBridge Release Configuration / Dx11FsrBridge 正式版配置
;  本文件是发布模板：打包与部署流程据此生成随包的 default_config\Dx11FsrBridge.ini。
; RELEASE TEMPLATE: the packaging / deployment flow generates the bundled default_config\Dx11FsrBridge.ini from it.
;  段名：功能键必须在 [Dx11FsrBridge] 段内，日志键在文件末尾的 [Log] / [Log.Categories] 段。
; Sections: functional keys live under [Dx11FsrBridge]; logging keys in [Log] / [Log.Categories].
;  本模板只含功能键 + 日志键，不含任何诊断键（分段性能探针、纹理/着色器追踪与 dump、相似度对比、HDR 与输出路径探针）。
; Functional + logging keys only - NO diagnostic keys; those exist in development builds only.
;  已移除（写进 ini 无效）：JitterFlag* 系列（Probe / Force / ProbeFrames / Hotkey）、LogLevel、Ffx12FullLogging、EnableLogging。
; Removed keys (no effect if written): the same list.
; ============================================================

[Dx11FsrBridge]

; --- 1. Core features / 核心功能 -----------------------------------------

; Enabled - 桥总开关；0=关闭，1=开启（默认：1）。
; Master switch for the bridge; 0 = off, 1 = on (default: 1).
Enabled=1

; Ffx12 - 超分总开关（接管游戏原生 FSR）；0=关闭，1=开启（本文件：1）。勿删本行。
; Enable the bridge's FSR upscaling; 0 = off, 1 = on (this file: 1). Do not delete this line.
Ffx12=1

; Ffx12Version - FSR 大版本（自动匹配该系列最新可用版本）；ffx12-fsr4.x=FSR4（推荐：RX 9000 系独显走 FP8，RX 7000 系独显、RDNA2 独显与 RDNA3/3.5 核显走 INT8，其余自动降级）、ffx12-fsr3.x=FSR3、ffx12-fsr2.x=FSR2；默认 ffx12-fsr4.x。
; FSR series (latest available version matched automatically); ffx12-fsr4.x = FSR4 (recommended: RX 9000 dGPUs run FP8; RX 7000 dGPUs, RDNA2 dGPUs and RDNA3/3.5 iGPUs run INT8; others degrade automatically), ffx12-fsr3.x = FSR3, ffx12-fsr2.x = FSR2.
Ffx12Version=ffx12-fsr4.x

; Ffx12DllPath - FFX12 SDK DLL 路径；留空=随包 payload\AMD\amd_fidelityfx_upscaler_dx12.dll（默认），也可填绝对/相对路径。
; Path to the FFX12 SDK DLL; empty = bundled payload\AMD\amd_fidelityfx_upscaler_dx12.dll (default), otherwise a path to it.
Ffx12DllPath=

; RenderScaleMenu - 渲染精度 hook 总开关；0=关闭（不 hook 菜单文本/渲染命令构建/精度应用，也不扩展候选精度档位），1=开启（默认：1）。
; Render-scale hook master switch; 0 = off (no menu module, candidate scale list not extended), 1 = on (default: 1).
RenderScaleMenu=1

; --- 2. Transparent-queue jitter fix / 透明队列抖动修复 (formal feature, ON by default / 正式功能，默认开启) ---

; TransparentJitter - 透明物件抖动（相机级开关：粒子/水面/贴花/半透明服饰一并纳入）；1=开启（默认），0=关闭。若出现闪烁/拖影设为 0。
; Transparent-object jitter (camera-wide: particles / water / decals / translucent cloth included); 1 = on (default), 0 = off. Set to 0 if you see flicker or ghosting.
TransparentJitter=1

; --- 3. Draw-entry filter / 绘制入口过滤 (formal feature, ON by default / 正式功能，默认开启) ---

; DrawEntryFilter - 绘制入口过滤（用钩子已有的调用实参淘汰不可能是 TAAU 目标的绘制）；1=启用（默认），0=关闭（一律走原路径）。失效时打 draw_entry_filter_disabled。
; Draw-entry filter (rejects non-TAAU-target draws using the call argument the hook already has); 1 = on (default), 0 = off (all draws take the original path). On failure logs draw_entry_filter_disabled.
DrawEntryFilter=1

; DrawEntryFilterCanary - canary 抽样步长（每 N 个非 3 绘制放行 1 个走完整内省路径）；64=默认，1=全部放行（等价于不装过滤器），0=全部不放行。
; Canary sampling stride: 1 of every N non-3 draws still takes the FULL introspection path; 64 = default, 1 = admit all (equivalent to no filter), 0 = admit none.
DrawEntryFilterCanary=64

; --- 4. Transport & performance / 传输与性能 -----------------------------

; Ffx12GpuInterop - GPU 传输方式；0=CPU 中转，1=纯 GPU（自建 D3D12+共享纹理，无 CPU 中转）（默认：1）。
; GPU transport mode; 0 = CPU roundtrip, 1 = pure GPU (own D3D12 + shared texture, no CPU staging) (default: 1).
Ffx12GpuInterop=1

; Ffx12AsyncUpscale - 异步交叠；0=同步（输出目标与 Present 后缓冲始终一致），1=异步（性能优先，要求输出目标在 dispatch 与 Present 之间不变）（默认：1）。手改会被安装器/启动器覆盖。
; Async overlap; 0 = synchronous (output target always matches the Present back buffer), 1 = asynchronous (performance-first; the target must stay unchanged between dispatch and Present) (default: 1). Manual edits are overwritten.
;   安装器与芙芙启动器每次安装或启动按显卡自动重写：AMD RDNA2（RX 6000 系）=0，其他显卡（NVIDIA / AMD RDNA3+ / Intel Arc 等）=1。
; Rewritten by the installer / launcher on every install or launch by GPU: AMD RDNA2 (RX 6000) = 0, all others = 1.
Ffx12AsyncUpscale=1

; Ffx12SingleInstance / Ffx12SingleInstancePick - 单实例接管（1=开启，默认，只接管一个实例；0=关闭，全部接管）与接管目标选择（0=自动，默认，render 面积大者优先，面积相同取最早的；1=强制最早的；2=强制最新的）。
; Single-instance takeover (1 = on, default, only ONE instance taken over; 0 = off, every instance taken over) and which instance to pick (0 = auto, default, largest area wins, earliest on a tie; 1 = first seen; 2 = last seen).
Ffx12SingleInstance=0
Ffx12SingleInstancePick=0

; --- P2 diagnostics / experiments (ALL DEFAULT OFF) / P2 诊断与实验开关（默认全关，与 P1 行为一致）---
;  诊断开关只写日志；实验开关只有显式打开才改变行为，不做 A/B 就保持 0。
; Diagnostics only write log lines; the experiments change behaviour ONLY when explicitly enabled.

; Ffx12SingleInstanceDiag - 多实例取证日志（裁决过程与 draw→实例 匹配，≤1 行/秒）；0=关（默认），1=开（会产生可观日志量）。
; Multi-instance evidence log (takeover election and draw->instance match, <=1 line/s); 0 = off (default), 1 = on (sizeable log volume).
Ffx12SingleInstanceDiag=0

; Ffx12SingleInstanceSticky / Ffx12SingleInstanceHoldMs - 粘滞裁决（1=开，0=关，默认 0）与其粘滞窗口（毫秒，仅粘滞裁决开启时生效；钳制到 [3000, 60000]，默认 10000）。开启期间最长比默认规则多等 (hold_ms - 3000) 毫秒才交棒。
; Sticky election (1 = on, 0 = off, default 0) and its sticky window in ms (used only when sticky is on; clamped to [3000, 60000], default 10000). Costs up to (hold_ms - 3000) ms of extra delay.
Ffx12SingleInstanceSticky=0
Ffx12SingleInstanceHoldMs=10000

; Ffx12SingleInstanceStrictMatch - 严格匹配：接管者仅靠 token 认领（无法校验归属）则不接管，放行游戏原生；0=关（默认），1=开。开启会跳过归属安全检查。
; Strict match: refuse a takeover claimed ONLY by a render token (ownership unverifiable); 0 = off (default), 1 = on. On skips the ownership safety check.
Ffx12SingleInstanceStrictMatch=0

; Fsr2FastStateTracking - 状态镜像钩子旁路（正式版性能开关）；1=开启（默认，学到目标像素着色器 hash 后资源/常量缓冲/渲染目标/视口钩子直接透传），0=每次都内省（很慢，仅 A/B 用）。
; Bypass the state-mirror hooks once the target pixel shader is known; 1 = on (default, the four hooks pass through), 0 = introspect every call (slow; A/B only).
Fsr2FastStateTracking=1

; --- 5. Frame Parameters / 画面参数 (tuned for this game; normally no change needed / 已按本游戏调优，通常无需改动) ---

; Ffx12AutoExposure / Ffx12NonLinear / Ffx12PqChain / Ffx12Hdr - 四者取值均为 0=关 / 1=开（后者为本文件值）：自动曝光（默认 1，勿改）、非线性色彩输入、PQ 色彩链（1=白屏，勿改）、HDR 输入。勿删本组各行。
; All four are 0 = off / 1 = on (the latter is this file's value): automatic exposure (default 1 - do not change), non-linear color input, PQ color pipeline (1 = white screen - do not change), HDR input. Do not delete any of them.
Ffx12AutoExposure=1
Ffx12NonLinear=0
Ffx12PqChain=0
Ffx12Hdr=0

; Ffx12MotionScale / Ffx12VelocityFactor / Ffx12DepthInverted / Ffx12MotionDecode - 运动矢量强度（浮点，1.0=标准，render 尺寸语义，默认）/ 帧间运动速度因子（整数，默认 50）/ 深度方向（0=正，1=逆，默认 1）/ 运动矢量解码方式（0=原始，1=平方解码，默认 1）；后三者勿改。
; Motion vector strength (float, 1.0 = standard, render-size semantics, default) / inter-frame motion velocity factor (integer, default 50) / depth direction (0 = normal, 1 = inverted, default 1) / motion vector decode mode (0 = raw, 1 = squared decode, default 1); do not change the last three.
Ffx12MotionScale=1.0
Ffx12VelocityFactor=50
Ffx12DepthInverted=1
Ffx12MotionDecode=1

; Ffx12JitterMode - 抖动模式；3=零中心（默认，推荐），4=恒定 -0.5px 偏置，0=偏置 +0.5，1=反号，2=原始归一化（≈无抖动），5=零抖动（诊断）。勿改回 4。
; Jitter generation mode; 3 = zero-centred (default, recommended), 4 = constant -0.5 px bias, 0 = offset +0.5, 1 = inverted sign, 2 = raw normalized (~no jitter), 5 = zero jitter (diagnostic). Do NOT change back to 4.
Ffx12JitterMode=3

; Ffx12JitterDelay - 抖动延迟；整数值，0=当前帧（默认，推荐）。
; Jitter delay in frames; 0 = current frame (default, recommended).
Ffx12JitterDelay=0

; Ffx12FovScale / Ffx12CameraNear / Ffx12CameraFar - 相机参数（需与游戏投影一致，改动会破坏画面）；浮点数，本文件：1.0 / 0.5 / 6000.0，勿改。勿删本组各行。
; Camera parameters (must match the game projection; changing them breaks the image); floats, this file: 1.0 / 0.5 / 6000.0 - do not change. Do not delete any of them.
Ffx12FovScale=1.0
Ffx12CameraNear=0.5
Ffx12CameraFar=6000.0

; --- 6. FSR2 input / masks / compositing family / FSR2 输入、蒙版与合成族 ---

; Fsr2MotionVectorScaleMode / Fsr2MotionVectorsJittered - 运动方向符号（0=反方向，1=正方向，默认 1，本游戏约定，勿改）/ 运动矢量是否已含抖动（0=否，默认，本游戏原版设置，勿改；1=是）。
; Motion vector direction sign (0 = negative, 1 = positive, default 1, this game's convention - do not change) / whether the motion vectors already contain jitter (0 = no, default, game original setting - do not change; 1 = yes).
Fsr2MotionVectorScaleMode=1
Fsr2MotionVectorsJittered=0

; Fsr2JitterMode - 游戏原生 jitter 读取的符号修正；3=双符号翻转（默认，本游戏约定）。与上方 Ffx12JitterMode 是两个不同的设置。
; Sign correction for the game's native jitter read; 3 = double sign flip (default, this game's convention). Distinct from Ffx12JitterMode above.
Fsr2JitterMode=3

; Fsr2UseReactiveMask / Fsr2UseTransparencyMask - reactive 蒙版（0=关，本文件，原版行为；1=开，抑制动态物体历史残留。勿删本行）/ 透明度蒙版（0=关，默认；1=开）。
; Reactive mask (0 = off, this file, original behaviour; 1 = on, suppresses history ghosting on dynamic objects - do not delete) / transparency mask (0 = off, default; 1 = on).
Fsr2UseReactiveMask=0
Fsr2UseTransparencyMask=0

; Fsr2FamilySkip / Fsr2Il2CppHook - 合成族预处理跳过（1=跳过游戏原生冗余预处理，本文件，推荐，勿删；0=不跳过。单实例接管下只要本进程出现第二个 FSR2 实例即自动关闭）/ il2cpp 钩子（1=开启，本文件，必需，勿删；0=关闭）。
; Skip the game's native redundant family preprocessing (1 = skip, this file, recommended, do not delete; 0 = do not skip; turns itself off under single-instance takeover as soon as a second FSR2 context exists) / il2cpp hook (1 = on, this file, required, do not delete; 0 = off).
Fsr2FamilySkip=1
Fsr2Il2CppHook=1

; Ffx12ReuseSameGeneration / Ffx12FeatureFallback - 备用输出复用（0=关，默认，开启会产生残像；1=开）/ 特征识别兜底（1=运行时特征识别优先 + 已知样本兜底，默认；0=纯特征识别）。
; Reuse the same-generation output buffer (0 = off, default, on causes ghosting; 1 = on) / feature-detection fallback (1 = runtime signature detection first with known good samples as a fallback, default; 0 = pure detection).
Ffx12ReuseSameGeneration=0
Ffx12FeatureFallback=1

; 可选：国际服（GenshinImpact.exe）RVA 覆盖 —— 桥按 exe 名自动选择，平时无需填写；下面三行只是"需要手工覆盖时"的写法示例（默认注释掉）。
; Optional RVA overrides for the international client; the bridge picks these automatically by executable name, so the comments below are examples only.
; Fsr2Il2CppRenderRvaGlobal=0x06B580D0 / Fsr2Il2CppUcbRvaGlobal=0x06B58060
; Ffx12CameraRvaGlobal=0x06B54420

; --- 6b. DLSS input path / DLSS 输入通路 (opt-in) ---
;
; 背景：桥默认把自己伪装成"一个调用 FSR2 的游戏"，于是 OptiScaler 走 FSR2/FFX 输入
; （那条链路对 N 卡是降级的：jitter 被钳成常量、MV 符号只为 FSR2 翻过、PQ 码值被当 HDR）。
; 打开本节后桥改扮"一个调用 NVSDK_NGX 的游戏"，OptiScaler 走 **DLSS 输入**，信息完整；
; 没有 OptiScaler 时可直接用 NVIDIA 的 nvngx.dll 出 DLSS（N 卡像 A 卡直出 FSR4 一样直出）。
;
; ⚠️ 默认 0（关）：切输入契约等于换掉所有已调好的语义，在实机验证前不默认打开。
; 详见 Dx11FsrBridge/DLSS_INPUT.md。
;
; DlssInput - DLSS 输入通路；0=关（默认，全部走原有 ffx 链路），1=auto（N 卡且能解析到 NGX 才切），
;             2=force（不管显卡，能解析到就切；A 卡 + OptiScaler 做 A/B 时用）。
; Dlss input path; 0 = off (default, everything uses the existing ffx chain),
; 1 = auto (only on NVIDIA when NGX resolves), 2 = force (try regardless of vendor).
DlssInput=0
;
; DlssInputJitterReduce - 抖动归约方式（**画质关键**）。
;   0=PhaseScaled（默认）相位域映射 fract(norm+0.5)-0.5：每个新相位都是新亚像素位置，
;     序列均匀零中心 —— DLSS M/L（transformer）对抖动序列均匀性敏感，这是消除
;     "线条规律抖动"的关键。
;   1=Wrap 像素域折返（旧实现）：把 Halton 相位打散成稀疏格点（实测 64 帧仅 17 种），
;     仅用于 A/B 对照。
;   2=Clamp 饱和（桥最早的行为）：几乎恒定（64 帧仅 1 种），保留仅为排障。
;   3=None 不处理（会超界，仅诊断）。
; How jitter is reduced (QUALITY-CRITICAL). 0 = PhaseScaled (default): map in phase
; domain so every new phase becomes a new sub-pixel position - uniform and zero-centred,
; which is what DLSS's transformer presets (M/L) need to avoid regular line shimmer.
; 1 = Wrap (old): scatters Halton phases onto sparse grid points (17 of 64 frames).
; 2 = Clamp (oldest): nearly constant (1 of 64). 3 = None (diagnostic, can exceed range).
DlssInputJitterReduce=0
;
; DlssInputJitterMode - **抖动符号约定（独立于 Ffx12JitterMode）**。默认 3。
;   为什么必须独立：FFX 的语义是 samplePos = pixelPos + jitterOffset，
;   而 NGX 的 Jitter.Offset 语义方向相反。共用 Ffx12JitterMode 会让"改 DLSS 符号"
;   顺带改坏 FFX 路径，出问题无法归因。
;   编号沿�� Ffx12JitterMode：
;     0 = +n*W - 0.5   （符号反转相对默认）
;     1 = +n*W
;     2 = raw          （≈无抖动）
;     3 = -n*W + 0.5   （**默认**，零中心，实机基线）
;     4 = -n*W         （恒定 -0.5px 偏置，DLSS 会出现网格状黑线）
;     5 = 0            （诊断：关抖动）
;   症状对照：若"抗锯齿几乎完全失效 + 鬼影位置漂移"，优先试 0。
; Jitter sign convention, independent of Ffx12JitterMode (FSR2 and NGX use
; opposite jitter directions). Default 3. If AA breaks down, try 0.
DlssInputJitterMode=3
;
; DlssInputReactiveMask - **reactive mask 开关**（motion.b 合成）。默认 0=关。
;   启用后把 motion 的 B 通道作为 reactive 喂给 DLSS 的
;   `DLSS.Input.Bias.Current.Color.Mask`，告诉它"这些像素的当前帧颜色不可信，
;   请降低历史权重"。
;
;   典型适用场景（正是当前剩余问题的描述）：
;     角色本身颜色与场景对比度低时（白衣/白丝站在灰白地面），转动视角会在
;     角色边缘出现拖影 —— 因为 DLSS 靠**颜色差异**判断历史是否可信，
;     低对比时会把"新露出的角色"误判为"背景的延续"，于是沿用旧历史。
;
;   为什么这次值得重试：第 2 轮曾启用并判定"无效且更糟"，但当时的
;   jitter 符号（mode 3）与 MV 符号（负 scale）**都是错的**，整个时域系统
;   处于坏状态，reactive 的效果无法归因。现在基线已修正，结论需重测。
; Reactive mask switch (motion.b -> DLSS bias mask). Default off. Retry is
; justified now because the earlier negative result was measured on a broken
; jitter/MV baseline.
DlssInputReactiveMask=0
;
;
; DlssInputMotionFixup - 运动矢量符号修正；0=用负 scale 抵消（默认，零额外 GPU 成本），
;;   1=要求解码纹理改用游戏原生符号（语义最干净，需改后端解码符号）。
; Motion-vector sign fix-up; 0 = negative scale (default, no extra GPU cost),
; 1 = require the decoded texture to use the game's native sign instead.
DlssInputMotionFixup=0
;
; DlssInputModule - 用于获取 NGX 的模块名；OptiScaler 会拦下这个名字并返回自身。
;   排查时可改成绝对路径直接指定某个 NGX 实现。
; Module name used to obtain NGX; OptiScaler intercepts this name and serves itself.
DlssInputModule=nvngx.dll
;
; DlssInputAllowRealNgx - 没有 OptiScaler 时是否直接用 NVIDIA 原生 NGX；1=允许（默认），0=只认 OptiScaler。
; Whether to fall back to the real NVIDIA NGX when OptiScaler is absent; 1 = yes (default).
DlssInputAllowRealNgx=1
;
; DlssInputMotionSign - **运动矢量 scale 符号（画质关键，实机定论）**。默认 1。
;   ★ 1 = 正 scale（**正确值**，2026-11-10 实机确认：K/M/L 画面与 FFX 输入持平）
;     0 = 负 scale（此前的错误默认；会让 K 模型一动就大面积拖影模糊）
;     2 = 关闭 MV（scale=0），诊断档：若设 2 后拖影消失，说明问题在 MV 链路
;     3 = 原始纹理 + 正 scale（不解码，用于验证解码是否必要；实测比解码差）
;
;   为什么正 scale 才对（此前推导写反了）：
;     FSR2 纹理语义  history = uv + mv*scale
;     NGX 纹理语义   prev    = uv - mv*scale
;   而桥的解码式 `-sign(d)*4d²` 已经取过一次负，得到的纹理是 **-mv_g**。
;   代入 NGX：uv - (-mv_g)*s = uv + mv_g*s
;   要让 history = uv - mv_g，需要 s = +1。
;   ⇒ 之前用 -1 相当于把方向又翻了一次，历史朝反方向采样 ⇒ 拖影。
;
;   ⚠️ 这一项曾误判为"无效"（第 5 轮测试），原因是当时 jitter 符号也被改错，
;      两个错误互相抵消，掩盖了真实效果。修正 MV 后画面立即正常。
; Motion-vector scale sign (QUALITY-CRITICAL). Default 1 (positive) - confirmed
; on real hardware; 0 (negative, the old default) causes heavy motion smear.
DlssInputMotionSign=1
;
; DlssInputMvProbe - 运动矢量数值探针（诊断，默认 0=关）。
;   开启后每 600 帧把"解码后送给 DLSS 的那份 MV"读回一次并打印 9 点均值：
;     dlss_mv_probe n=... mean=(x,y) size=... (expect ~0 when static, non-zero when moving)
;   判读：静态场景应接近 0；运动时应显著非 0。若静态也远离 0，或运动时恒为 0，
;   说明解码式（d=raw-0.498039; mv=-sign(d)*4d²）不适用于当前游戏版本。
;   刻意做成低频（600 帧一次）：每帧读回会同步等 GPU，吃掉帧数（AGENTS.md §二.5）。
; Motion-vector numeric probe (diagnostic, default off). Reads back the MV that is
; actually handed to DLSS every 600 frames and logs a 9-point mean.
DlssInputMvProbe=0
;
; DlssInputDepthScale - **深度值域归一化倍数（画质关键）**。默认 32。
;   游戏逆深度实际值域约 [0, 0.03]，而 DLSS 期望深度落在 [0,1]。
;   不归一化（=1）时前后景在数值上几乎不可分，DLSS 会把背景整片当同一平面
;   累积历史 ⇒ **运动中大面积拖影**，近景（角色）反而正常。
;   这就是"角色清晰、背景发灰发虚"的直接成因。
;   调大 ⇒ 远景层次更分明但可能过曝截断；调小 ⇒ 又退回拖影。
; Depth range normalisation factor (QUALITY-CRITICAL). Default 32: the game's
; reverse-Z depth spans ~[0, 0.03] while DLSS expects [0,1]. At 1 the background
; becomes numerically indistinguishable and smears when the camera moves.
DlssInputDepthScale=32
;
; DlssInputJitterProbe - 抖动来源探针（诊断，默认 0=关）。
;   桥读 il2cpp 的 jitter 字段时，实机发现它在 [0,1) 内"一直有效"但**稳态下
;   每 600~1200 帧才更新一次**。本开关强制额外读一次 cb0（游戏自己传给
;   accumulate shader 的抖动，定义上是真值），并四路对比打印：
;     dlss_jitter_probe n=.. render=(..) cb0=(..) cb27=(..) cb26=(..) locked_slot=..
;   判读：哪一路逐帧变化，那一路才是真 jitter。若 cb0 逐帧变而 render 不变，
;   说明桥应该改用 cb0（ffx 路径本来就是这么做的）。
; Jitter source probe (diagnostic, default off). Forces an extra cb0 readback and
; prints four-way comparison so we can see which source actually changes per frame.
DlssInputJitterProbe=0
;
; Fsr2InputDump / Fsr2InputDumpFrames - **输入纹理转储（诊断）**。默认 0=关。
;   开启后把 DLSS 实际收到的 color/depth/motion/output 落盘到 <ini 目录>\fsr2dump，
;   用于回答"DLSS 到底收到了什么"。只在 -Diagnostics 诊断构建里可用
;   （发布构建不编译该模块）。跨帧延迟读回，不在 draw 内做 CPU 同步。
; Input texture dump (diagnostic). Writes what DLSS actually receives to
; <ini dir>\fsr2dump. Only compiled in -Diagnostics builds.
Fsr2InputDump=0
Fsr2InputDumpFrames=5
; Fsr2InputDumpHotkey - 触发热键（VK 码）。0=不启用；121=F10, 120=F9, 122=F11。
;   **必须设 AutoStartSec=0**：两者任一 >0 都会置 require_trigger，
;   若只设 Hotkey 而 AutoStartSec 也 >0，则按秒触发与热键同时生效，难以判断。
; Trigger hotkey (VK code). 121=F10.
Fsr2InputDumpHotkey=0
; Fsr2InputDumpAutoStartSec - 启动后 N 秒自动触发一次；0=关。
; Auto-trigger after N seconds; 0 = disabled.
Fsr2InputDumpAutoStartSec=0
; Fsr2InputDumpIntervalMs - 帧间间隔（毫秒）；0=连抓。
; Delay between captured frames (ms); 0 = back-to-back.
Fsr2InputDumpIntervalMs=100

; --- 7. Compatibility notes / 兼容性说明 ---

; RDNA2 独显与 RDNA3.5 核显自 2026-10 起不再封锁，默认按 FSR4 INT8 运行；这两类平台的官方 FSR4 需要 Adrenalin 26.10.1 或以上驱动（驱动更旧时只走 INT8 兼容路径，安装器首次装 OptiScaler 时会提示）。
; RDNA2 dGPUs and RDNA3.5 iGPUs are no longer blocked as of 2026-10 and default to FSR4 INT8; official FSR4 on these two platform classes requires Adrenalin 26.10.1 or newer (older drivers only get the INT8 compatibility path; the installer prompts once on the first OptiScaler install).

[Log]
; --- 日志配置（全部日志选项集中在本段与下方 [Log.Categories]）/ Logging configuration - every option lives here and in [Log.Categories] below ---

; level - 全局等级；off / error / warn / info / debug / trace，也接受 0..5（0=off）。level=off 即完全关闭日志。默认 info。
; Global level; off / error / warn / info / debug / trace, also accepts 0..5 (0 = off). level=off disables logging. Default info.
level=info

; to_file - 写日志文件（唯一事实来源）；1=开（默认），0=关。
; Write the log file (single source of truth); 1 = on (default), 0 = off.
to_file=1

; to_debugger - 同时输出到调试器（DebugView 可见）；1=开，0=关（默认）。每秒上限固定，不可通过 ini 配置。
; Also mirror lines to the debugger (visible in DebugView); 1 = on, 0 = off (default). Fixed per-second cap, not configurable.
to_debugger=0

; truncate_on_start - 每次启动清空日志；1=清空（默认），0=追加。
; Truncate the log on every start; 1 = truncate (default), 0 = append.
truncate_on_start=1

; max_file_kb / rotate_keep - 超过大小即轮转，保留 N 份（Dx11FsrBridge.log.1/.2...）；max_file_kb=0 表示不轮转。默认 16384 KB / 2 份。
; Rotate when the file exceeds this size, keeping N files; max_file_kb=0 disables rotation. Default 16384 KB / keep 2.
max_file_kb=16384
rotate_keep=2

; queue_capacity - 异步写队列深度（条）；默认 8192，钳制到 [1024, 262144]。队列满时丢最旧一条（计入 dropped），调用线程永不阻塞。
; Async write-queue depth; default 8192, clamped to [1024, 262144]. When full the oldest entry is dropped (counted as dropped); the caller never blocks.
queue_capacity=8192

; compat_prefix - 尚未声明等级的日志行按消息前缀归类；1=按前缀归类，0=统一归 core（默认，不会被丢弃）。
; Classify legacy level-less lines by message prefix; 1 = classify by prefix, 0 = all land in `core` (default, never dropped).
compat_prefix=0

; --- [Log.Categories] - 按子系统覆盖全局等级（每行 `分类=等级`）/ Per-subsystem override of the global level (one `category=level` per line) ---
;  用法：level 设全局阈值，本段按子系统覆盖（示例：level=info / [Log.Categories] / probe=debug / upscale=debug）。
; Usage: level sets the global threshold; this section overrides it per subsystem.
;  分类一览 / Categories： / core     生命周期/加载/GPU 路由      hook     DXGI/D3D11/il2cpp 钩子
;      config   ini 读取与生效结果          upscale  FSR/FFX 后端与 dispatch / menu     渲染精度菜单集成            hdr      HDR/色彩/色调映射
;      coexist  OptiScaler/ReShade/DLSSG    fg       帧生成 / 某个分类设为 off 即彻底静默它（如 fg=off）。
; Setting a category to off silences it completely (e.g. fg=off).
; probe=debug / upscale=debug
[Log.Categories]
